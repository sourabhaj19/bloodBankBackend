<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title th:text="${subject}">Welcome Email</title>
  <style>
        body { font-family: Arial, sans-serif; line-height: 1.6; color: #333; }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; }
        .header { background-color: #f8f9fa; padding: 10px; text-align: center; }
        .content { padding: 20px; }
        .footer { margin-top: 20px; font-size: 0.8em; color: #666; }
    </style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1 th:text="${title}">Welcome to Our Service</h1>
  </div>

  <div class="content">
    <p>Hello <span th:text="${name}">User</span>,</p>

    <p th:text="${message}">
      Thank you for registering with our service. We're excited to have you on board!
    </p>

    <p>Here are your account details:</p>
    <ul>
      <li>Username: <span th:text="${username}">username</span></li>
      <li>Registration date: <span th:text="${#dates.format(registrationDate, 'dd MMM yyyy')}">01 Jan 2023</span></li>
    </ul>

    <p>
      <a th:href="${activationLink}"
         style="background-color: #007bff; color: white; padding: 10px 15px; text-decoration: none; border-radius: 5px;">
        Activate Your Account
      </a>
    </p>
  </div>

  <div class="footer">
    <p>Best regards,<br>The Company Team</p>
    <p th:if="${unsubscribeLink}">
      <small>
        <a th:href="${unsubscribeLink}">Unsubscribe</a> from these emails.
      </small>
    </p>
  </div>
</div>
</body>
</html>
