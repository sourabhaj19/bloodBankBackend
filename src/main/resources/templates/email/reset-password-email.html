<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Password Reset Request</title>
    <style>
        /* Similar styling as above */
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>Password Reset Request</h1>
    </div>

    <div class="content">
        <p>Hello <span th:text="${name}">User</span>,</p>

        <p>We received a request to reset your password. Click the button below to proceed:</p>

        <p>
            <a th:href="${resetLink}"
               style="background-color: #dc3545; color: white; padding: 10px 15px; text-decoration: none; border-radius: 5px;">
                Reset Password
            </a>
        </p>

        <p>If you didn't request this, please ignore this email.</p>
        <p>The link will expire in <span th:text="${expirationHours}">24</span> hours.</p>
    </div>

    <div class="footer">
        <p>Best regards,<br>Security Team</p>
    </div>
</div>
</body>
</html>
